services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag_agent
      POSTGRES_DB: rag_agent
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rag_agent -d rag_agent']
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_DATABASE_URL: postgresql+psycopg://rag_agent@postgres:5432/rag_agent
      APP_JWT_SECRET: local-development-secret-local-development-secret
      APP_ENABLE_BOOTSTRAP_ADMIN: 'true'
      APP_LLM_PROVIDER: deterministic
      APP_EMBEDDING_PROVIDER: deterministic
      APP_LOG_LEVEL: INFO
    ports:
      - '8000:8000'

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3000:3000'
    depends_on:
      - prometheus

  # Workflow automation: import the files in n8n/ at http://localhost:5678.
  # Optional; nothing else depends on it.
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    environment:
      GENERIC_TIMEZONE: ${TZ:-America/Edmonton}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
      N8N_SECURE_COOKIE: 'false'
      GROUNDED_API_URL: http://api:8000
      GROUNDED_EMAIL: ${GROUNDED_EMAIL:-}
      GROUNDED_PASSWORD: ${GROUNDED_PASSWORD:-}
      GROUNDED_WORKSPACE_SLUG: ${GROUNDED_WORKSPACE_SLUG:-}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/workflows:ro
    ports:
      - '5678:5678'
    depends_on:
      - api

volumes:
  postgres-data:
  n8n-data:
